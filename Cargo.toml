[package]
name = "puzzlecellar"
version = "0.1.0"
edition = "2021"
description = "PuzzleCellar – generates printable puzzle booklets (Sudoku, Binoxo, Battleships, Nonograms) as PDF"
license = "MIT"
repository = "https://github.com/targetonline-at/puzzlecellar"

[dependencies]
# wgpu statt OpenGL: zeichnet unter Windows über DirectX 12 (OpenGL blieb mit dem AMD-Treiber weiß)
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
printpdf = "0.7"
ttf-parser = "0.25"
rand = "0.8"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Auch im Debug-Build die Generatoren optimieren, sonst dauern schwere Sudokus ewig
[profile.dev.package."*"]
opt-level = 2
[profile.dev]
opt-level = 1
